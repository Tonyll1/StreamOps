<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>StreamOps · Top</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #fff; padding: 12px; --accent: #ff6b35; }
  .board { width: min(420px, 100%); }
  h1 { font: 700 15px Inter, sans-serif; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .08em;
       display: inline-block; padding: 4px 12px; border-radius: 7px; background: var(--accent); color: #1a0d06; }
  h1:empty { display: none; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; margin-bottom: 6px;
         background: rgba(17,18,21,.9);
         border: 1px solid rgba(255,255,255,.09); border-left: 3px solid var(--accent); border-radius: 9px;
         transition: transform .55s cubic-bezier(.16,1,.3,1), opacity .45s ease; }
  .row.enter { transform: translateX(-34px) scale(.94); opacity: 0; }
  .row:nth-child(1) { border-left-color: #ffd54a; }
  .value.bump { animation: bump .5s cubic-bezier(.16,1,.3,1); } @keyframes bump { 40% { transform: scale(1.25); color: #ffd54a; } }
  .pos { width: 26px; font-weight: 800; font-size: 18px; text-align: center; color: var(--accent); }
  .row:nth-child(1) .pos { color: #ffd54a; } .row:nth-child(2) .pos { color: #cfd8dc; } .row:nth-child(3) .pos { color: #ffab73; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #334; flex: none; }
  .name { flex: 1; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .value { font: 700 18px Inter, sans-serif; font-variant-numeric: tabular-nums; display: inline-block; }
  .plat { font-size: 11px; opacity: .7; text-transform: uppercase; }
  /* Variante de un solo puesto: tarjeta grande */
  .single .row { flex-direction: column; text-align: center; padding: 16px; border-left: 0;
                 border-top: 3px solid var(--accent); }
  .single .pos { display: none; } .single .avatar { width: 84px; height: 84px; }
  .single .name { font-size: 24px; flex: none; max-width: 100%; } .single .value { font-size: 28px; }
  .empty { opacity: .6; font-size: 14px; padding: 8px 12px; }
</style>
</head>
<body>
<div class="board" id="board"><h1 id="title"></h1><div id="rows"></div></div>
<script src="/static/overlay.js"></script>
<script>
  const { params, fmt, esc, connect } = StreamOps;
  const metric = params.get("metric") || "coins";
  const scope = params.get("scope") === "all" ? "all" : "session";
  const limit = Math.max(1, Math.min(parseInt(params.get("limit") || "5", 10), 20));
  const titles = { coins: "Top donadores", likes: "Top likes", shares: "Top compartidos", comments: "Top chat" };
  const icons = { coins: "💎", likes: "❤", shares: "↗", comments: "💬" };
  if (params.get("accent")) document.body.style.setProperty("--accent", "#" + params.get("accent").replace("#", ""));
  document.getElementById("title").textContent =
    params.has("title") ? params.get("title") : titles[metric] + (scope === "all" ? " (histórico)" : "");
  if (limit === 1) document.getElementById("board").classList.add("single");
  const rowsEl = document.getElementById("rows");
  let known = new Set(), lastValues = {};

  function draw(rows) {
    rows = (rows || []).slice(0, limit);
    if (!rows.length) { rowsEl.innerHTML = params.get("hideempty") ? "" : '<div class="empty">Aún sin datos</div>'; known = new Set(); return; }
    const next = new Set();
    rowsEl.innerHTML = rows.map((r, i) => {
      const key = r.platform + ":" + r.name; next.add(key);
      const avatar = r.avatar ? `<img class="avatar" src="${esc(r.avatar)}" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<div class="avatar"></div>';
      const grew = known.has(key) && r.value > (lastValues[key] || 0); lastValues[key] = r.value;
      return `<div class="row ${known.has(key) ? "" : "enter"}"><div class="pos">${i + 1}</div>${avatar}
        <div class="name">${esc(r.name)}</div><div class="value ${grew ? "bump" : ""}">${icons[metric]} ${fmt(r.value)}</div></div>`;
    }).join("");
    known = next;
    requestAnimationFrame(() => rowsEl.querySelectorAll(".enter").forEach((el) => el.classList.remove("enter")));
  }
  connect((msg) => { if (msg.type === "state") draw(msg[scope] && msg[scope][metric]); });
</script>
</body>
</html>
