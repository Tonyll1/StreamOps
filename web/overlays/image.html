<!doctype html>
<html lang="es" class="overlay">
<head>
<meta charset="utf-8"><title>StreamOps · Imagen o GIF</title>
<link rel="stylesheet" href="/static/overlay.css">
<style>
  body { display:flex; flex-direction:column; align-items:center; gap:6px; }
  img { max-width:var(--w,300px); max-height:90vh; display:block; will-change:transform; }
  .float { animation:float 3s ease-in-out infinite; } .spin { animation:spin 6s linear infinite; } .pulse { animation:pulse 1.4s ease-in-out infinite; } .shake { animation:shake .5s linear infinite; }
  @keyframes float { 50% { transform:translateY(-14px); } } @keyframes spin { to { transform:rotate(360deg); } } @keyframes pulse { 50% { transform:scale(1.08); } } @keyframes shake { 25% { transform:rotate(-4deg); } 75% { transform:rotate(4deg); } }
  .cap { font-weight:800; font-size:20px; text-shadow:0 2px 0 rgba(0,0,0,.6), 0 3px 10px rgba(0,0,0,.9); } .cap:empty { display:none; }
  .ph { padding:18px 22px; color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<script src="/static/overlay.js"></script>
<script>
  // Tu propio GIF, logo o imagen como decoración fija, con un efecto opcional.
  const S = StreamOps, gif = S.p("gif");
  document.documentElement.style.setProperty("--w", S.num("size", 300) + "px");
  document.body.innerHTML += gif ? `<img class="${S.esc(S.p("effect"))}" src="${S.media(gif)}"><div class="cap">${S.esc(S.p("text"))}</div>` : '<div class="panel ph">Elige tu GIF o imagen en Personalizar</div>';
</script>
</body>
</html>
