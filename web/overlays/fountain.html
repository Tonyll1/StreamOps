<!doctype html>
<html lang="es" class="overlay">
<head>
<meta charset="utf-8"><title>StreamOps · Lluvia</title>
<link rel="stylesheet" href="/static/overlay.css">
<style>
  body { height:100vh; padding:0; }
  .p { position:absolute; bottom:-60px; font-size:var(--s,34px); line-height:1; will-change:transform,opacity; animation:rise var(--d,3s) ease-out forwards; pointer-events:none; }
  .p img { height:var(--s,34px); display:block; }
  .fall .p { bottom:auto; top:-60px; animation-name:fall; }
  @keyframes rise { 0% { transform:translate(0,0) scale(.5); opacity:0; } 12% { opacity:1; } 100% { transform:translate(var(--x,0),-105vh) scale(1.1) rotate(var(--r,0)); opacity:0; } }
  @keyframes fall { 0% { transform:translate(0,0) rotate(0); opacity:0; } 10% { opacity:1; } 100% { transform:translate(var(--x,0),112vh) rotate(var(--r,0)); opacity:.9; } }
</style>
</head>
<body>
<script src="/static/overlay.js"></script>
<script>
  // Partículas por evento: corazones en likes por defecto, o tu propio GIF/imagen.
  const S = StreamOps, type = S.p("type", "like"), gif = S.p("gif"), size = S.num("size", 34), cap = S.num("max", 60);
  const emoji = S.p("emoji", { like: "❤", gift: "🎁", follow: "⭐", share: "🔁", chat: "💬", sub: "💜" }[type] || "✨");
  if (S.p("dir") === "down") document.body.classList.add("fall");
  let alive = 0;
  function spawn() {
    if (alive >= cap) return;
    alive++;
    const el = document.createElement("div");
    el.className = "p";
    el.style.left = (5 + Math.random() * 90) + "%";
    el.style.setProperty("--s", (size * (0.7 + Math.random() * 0.7)).toFixed(0) + "px");
    el.style.setProperty("--d", (2.4 + Math.random() * 2).toFixed(2) + "s");
    el.style.setProperty("--x", ((Math.random() - 0.5) * 160).toFixed(0) + "px");
    el.style.setProperty("--r", ((Math.random() - 0.5) * 80).toFixed(0) + "deg");
    if (gif) { const img = new Image(); img.src = S.media(gif); el.appendChild(img); } else el.textContent = emoji;
    el.addEventListener("animationend", () => { el.remove(); alive--; });
    document.body.appendChild(el);
  }
  function burst(n) { for (let i = 0; i < n; i++) setTimeout(spawn, i * 70); }
  S.connect((msg) => {
    if (msg.type !== "event" || msg.event.type !== type) return;
    const e = msg.event;
    burst(Math.min(25, type === "like" ? Math.ceil((e.count || 1) / 3) : type === "gift" ? Math.max(3, Math.ceil(e.value / 10)) : 5));
  });
</script>
</body>
</html>
