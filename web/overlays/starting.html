<!doctype html>
<html lang="es" class="overlay">
<head>
<meta charset="utf-8"><title>StreamOps · Pantalla de espera</title>
<link rel="stylesheet" href="/static/overlay.css">
<style>
  body { padding:0; height:100vh; display:grid; place-items:center; background:#0e0f11 center/cover no-repeat; }
  body.clear { background-color:transparent; }
  .mid { text-align:center; padding:28px 40px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  img { max-height:34vh; max-width:60vw; }
  h1 { margin:0; font-size:clamp(30px,6vw,72px); font-weight:800; letter-spacing:-.02em; text-shadow:0 3px 18px rgba(0,0,0,.7); }
  p { margin:0; font-size:clamp(14px,2vw,24px); color:var(--dim); font-weight:600; } p:empty { display:none; }
  .time { font-size:clamp(40px,9vw,120px); font-weight:800; color:var(--accent); line-height:1; text-shadow:0 3px 18px rgba(0,0,0,.7); }
  .dots i { display:inline-block; width:10px; height:10px; margin:0 5px; border-radius:50%; background:var(--accent); animation:dot 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay:.15s; } .dots i:nth-child(3) { animation-delay:.3s; } @keyframes dot { 50% { transform:translateY(-10px); opacity:.5; } }
</style>
</head>
<body>
<div class="mid" id="mid"></div>
<script src="/static/overlay.js"></script>
<script>
  // Pantalla de "empezamos pronto", "ya vuelvo" o "fin": título, tu GIF, tu fondo y cuenta regresiva.
  const S = StreamOps, minutes = S.num("minutes", 5), gif = S.p("gif"), bg = S.p("bg"), sound = S.p("sound"), endAt = Date.now() + minutes * 60000;
  if (bg) document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),url("${S.media(bg)}")`;
  if (S.flag("clear", false)) document.body.classList.add("clear");
  document.getElementById("mid").innerHTML = (gif ? `<img src="${S.media(gif)}">` : "") + `<h1>${S.esc(S.p("title", "Empezamos pronto"))}</h1><p>${S.esc(S.p("sub", ""))}</p>` +
    (minutes > 0 ? '<div class="time num" id="time"></div>' : '<div class="dots"><i></i><i></i><i></i></div>');
  let done = false;
  function draw() {
    const el = document.getElementById("time"); if (!el) return;
    const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    if (!left && !done) { done = true; S.sound(sound); el.textContent = S.p("end", "¡Ya!"); }
  }
  setInterval(() => { if (!done) draw(); }, 250); draw();
  S.connect(() => {});
</script>
</body>
</html>
