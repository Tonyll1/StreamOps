<!doctype html>
<html lang="es" class="overlay">
<head>
<meta charset="utf-8"><title>StreamOps · Subtítulos de voz</title>
<link rel="stylesheet" href="/static/overlay.css">
<style>
  body { height:100vh; display:flex; align-items:flex-end; justify-content:center; }
  .sub { display:flex; align-items:center; gap:12px; max-width:min(900px,94vw); padding:10px 18px; opacity:0; transform:translateY(10px); transition:opacity .25s, transform .25s var(--ease); }
  .sub.on { opacity:1; transform:none; }
  .bars { display:flex; align-items:flex-end; gap:3px; height:22px; flex:none; }
  .bars i { width:4px; border-radius:2px; background:var(--accent); animation:eq .7s ease-in-out infinite alternate; }
  .bars i:nth-child(2) { animation-delay:-.3s; } .bars i:nth-child(3) { animation-delay:-.5s; } .bars i:nth-child(4) { animation-delay:-.15s; }
  @keyframes eq { from { height:20%; } to { height:100%; } }
  .voice { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent); }
  .text { font-size:21px; font-weight:600; line-height:1.3; }
</style>
</head>
<body>
<div class="panel sub" id="sub"><div class="bars"><i></i><i></i><i></i><i></i></div><div><div class="voice" id="voice"></div><div class="text" id="text"></div></div></div>
<script src="/static/overlay.js"></script>
<script>
  // Muestra en pantalla lo que el bot está leyendo en voz alta.
  const S = StreamOps, sub = document.getElementById("sub"), showVoice = S.flag("voice", true);
  let hide = null;
  S.connect((msg) => {
    if (msg.type === "tts") {
      clearTimeout(hide);
      document.getElementById("text").textContent = msg.text;
      document.getElementById("voice").textContent = showVoice ? (msg.voice || "") : "";
      sub.classList.add("on");
      hide = setTimeout(() => sub.classList.remove("on"), Math.max(4, (msg.seconds || 6) + 1.5) * 1000);
    } else if (msg.type === "tts_end" || msg.type === "stop" || (msg.type === "mute" && msg.muted)) {
      clearTimeout(hide); hide = setTimeout(() => sub.classList.remove("on"), msg.type === "tts_end" ? 600 : 0);
    }
  });
</script>
</body>
</html>
