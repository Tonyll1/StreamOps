<!doctype html>
<html lang="es" class="overlay">
<head>
<meta charset="utf-8"><title>StreamOps · Contadores</title>
<link rel="stylesheet" href="/static/overlay.css">
<style>
  #row { display:inline-flex; gap:8px; flex-wrap:wrap; } #row.col { flex-direction:column; }
  .stat { display:flex; align-items:center; gap:10px; padding:8px 14px; min-width:120px; }
  .ico { font-size:20px; } .v { font-size:22px; font-weight:800; line-height:1.1; display:inline-block; } .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; font-weight:600; }
  .v.bump { animation:bump .35s var(--ease); } @keyframes bump { 40% { transform:scale(1.18); color:var(--accent); } }
</style>
</head>
<body>
<div id="row"></div>
<script src="/static/overlay.js"></script>
<script>
  const S = StreamOps, row = document.getElementById("row");
  const defs = { coins: ["💎", "Monedas"], likes: ["❤", "Likes"], follows: ["➕", "Seguidores"], shares: ["↗", "Compartidos"] };
  const show = S.p("show", "coins,likes,follows,shares").split(",").filter((k) => defs[k]);
  if (S.p("layout") === "col") row.classList.add("col");
  row.innerHTML = show.map((k) => `<div class="panel stat"><span class="ico">${defs[k][0]}</span><div><div class="v num" id="v_${k}">0</div><div class="l">${defs[k][1]}</div></div></div>`).join("");
  const last = {};
  S.connect((msg) => {
    if (msg.type !== "state") return;
    for (const k of show) {
      const value = (msg.counters && msg.counters[k]) || 0, el = document.getElementById("v_" + k);
      if (last[k] === value) continue;
      el.textContent = S.fmt(value);
      if (last[k] !== undefined && value > last[k]) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
      last[k] = value;
    }
  });
</script>
</body>
</html>
