<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>StreamOps · Alertas</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
         display: flex; align-items: center; justify-content: center; }
  #alert { display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 90vw;
           opacity: 0; transform: scale(.8) translateY(20px); transition: opacity .35s ease, transform .35s cubic-bezier(.2,1.4,.4,1); }
  #alert.show { opacity: 1; transform: none; }
  #media img, #media video { max-width: 70vw; max-height: 60vh; border-radius: 14px; display: block; }
  #avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 4px solid #ff3b7f; display: none; }
  #text { font-size: 38px; font-weight: 800; text-align: center; line-height: 1.2;
          text-shadow: 0 0 12px rgba(255,59,127,.9), 0 3px 8px rgba(0,0,0,.9); }
</style>
</head>
<body>
<div id="alert"><img id="avatar" referrerpolicy="no-referrer" alt=""><div id="media"></div><div id="text"></div></div>
<script src="/static/overlay.js"></script>
<script>
  const box = document.getElementById("alert"), mediaEl = document.getElementById("media");
  const textEl = document.getElementById("text"), avatarEl = document.getElementById("avatar");
  const queue = []; let busy = false, muted = false, timer = null, finish = null;

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    const a = queue.shift();
    textEl.textContent = a.text || "";
    mediaEl.innerHTML = "";
    const showAvatar = a.avatar && !a.media;
    avatarEl.style.display = showAvatar ? "block" : "none";
    if (showAvatar) avatarEl.src = a.avatar;
    let duration = (a.duration || 5) * 1000;
    finish = () => {
      clearTimeout(timer); finish = null;
      box.classList.remove("show");
      setTimeout(() => { mediaEl.innerHTML = ""; busy = false; next(); }, 400);
    };
    if (a.media_kind === "image") {
      const img = new Image(); img.src = a.media; mediaEl.appendChild(img);
    } else if (a.media_kind === "video") {
      const v = document.createElement("video");
      v.src = a.media; v.autoplay = true; v.muted = muted || a.muted; v.playsInline = true;
      v.onended = () => finish && finish();
      v.onerror = () => finish && finish();
      mediaEl.appendChild(v);
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      duration = Math.max(duration, 60000); // el video manda; tope de seguridad
    }
    box.classList.add("show");
    timer = setTimeout(() => finish && finish(), duration);
  }

  StreamOps.connect((msg) => {
    if (msg.type === "alert") { if (queue.length < 30) queue.push(msg); next(); }
    else if (msg.type === "state" || msg.type === "mute") {
      muted = !!msg.muted;
      mediaEl.querySelectorAll("video").forEach((v) => (v.muted = muted));
      if (muted && msg.type === "mute") { queue.length = 0; if (finish) finish(); }
    } else if (msg.type === "stop") { queue.length = 0; if (finish) finish(); }
  });
</script>
</body>
</html>
