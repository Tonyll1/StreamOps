<!doctype html>
<html lang="es" class="overlay">
<head>
<meta charset="utf-8"><title>StreamOps · Burbujas de chat</title>
<link rel="stylesheet" href="/static/overlay.css">
<style>
  body { padding:0; height:100vh; }
  .b { position:absolute; max-width:300px; padding:9px 14px; border-radius:18px 18px 18px 4px; background:#fff; color:#111; font-size:var(--fs,16px); line-height:1.3; word-break:break-word;
       box-shadow:0 6px 18px rgba(0,0,0,.35); animation:pop .4s var(--ease), drift var(--t,6s) ease-in-out .4s forwards; will-change:transform,opacity; }
  .b b { display:block; font-size:.78em; color:var(--u,#e0332e); }
  .dark .b { background:var(--panel); color:#fff; border:1px solid var(--line); }
  @keyframes drift { 80% { opacity:1; } 100% { transform:translateY(-46px); opacity:0; } }
</style>
</head>
<body>
<script src="/static/overlay.js"></script>
<script>
  // Cada mensaje aparece como un globo en un punto al azar, flota y desaparece.
  const S = StreamOps, seconds = S.num("seconds", 6), cap = S.num("max", 10);
  const palette = ["#e0332e", "#1f7ae0", "#16935b", "#b0349a", "#c9730a", "#6a4bd8"];
  if (S.p("style") === "dark") document.body.classList.add("dark");
  S.connect((msg) => {
    if (msg.type !== "event" || msg.event.type !== "chat" || !msg.event.text || msg.event.text.startsWith("!")) return;
    if (document.querySelectorAll(".b").length >= cap) return;
    const e = msg.event, el = document.createElement("div");
    let h = 0; for (const c of e.user_id || e.user) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    el.className = "b"; el.style.setProperty("--fs", S.num("size", 16) + "px"); el.style.setProperty("--t", seconds + "s"); el.style.setProperty("--u", palette[h % palette.length]);
    el.style.left = (3 + Math.random() * Math.max(5, 97 - 30000 / innerWidth)) + "%"; el.style.top = (12 + Math.random() * 68) + "%";
    el.innerHTML = `<b>${S.esc(e.user)}</b>${S.esc(e.text.slice(0, 140))}`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), seconds * 1000 + 500);
  });
</script>
</body>
</html>
